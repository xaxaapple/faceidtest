<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face ID проверка</title>
<style>
  body{font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#111;color:#fff;text-align:center}
  button{font-size:20px;padding:16px 32px;border:0;border-radius:14px;background:#0a84ff;color:#fff}
  #r{margin-top:24px;font-size:22px;padding:0 16px}
</style>
</head>
<body>
<button id="b">Проверить лицо</button>
<div id="r"></div>
<script>
const r = document.getElementById('r');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));

document.getElementById('b').onclick = async () => {
  r.textContent = '';
  if (!window.PublicKeyCredential) { r.textContent = '❌ WebAuthn не поддерживается'; return; }
  try {
    const saved = localStorage.getItem('cid');
    if (!saved) {
      // первый запуск: создаём ключ, iPhone просит Face ID
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: rnd(32),
        rp: { name: 'FaceID Check', id: location.hostname },
        user: { id: rnd(16), name: 'user', displayName: 'user' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }});
      localStorage.setItem('cid', b64(cred.rawId));
      r.textContent = '✅ Лицо подтверждено (ключ создан)';
    } else {
      await navigator.credentials.get({ publicKey: {
        challenge: rnd(32),
        allowCredentials: [{ type: 'public-key', id: unb64(saved), transports: ['internal'] }],
        userVerification: 'required',
        timeout: 60000
      }});
      r.textContent = '✅ Лицо достоверно';
    }
  } catch (e) {
    r.textContent = '❌ Не подтверждено';
  }
};
</script>
</body>
</html>
